<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>肥肥风筝猫 · 管理台</title>
<style>
  :root {
    --bg: #12141a;
    --panel: #1a1d25;
    --panel-2: #20242e;
    --line: #2b3040;
    --fg: #e6e9f0;
    --fg-dim: #98a0b3;
    --fg-mute: #6b7488;
    --accent: #5aa9e6;
    --ok: #4ec9a0;
    --warn: #e6b455;
    --danger: #e06c75;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 13px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", Roboto, sans-serif;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }

  /* ---- 登录 ---- */
  #login {
    position: fixed; inset: 0; display: none; place-items: center;
    background: var(--bg); z-index: 100;
  }
  #login.show { display: grid; }
  #login .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 32px; width: 340px; text-align: center;
  }
  #login h1 { font-size: 18px; margin: 0 0 6px; }
  #login p { color: var(--fg-dim); margin: 0 0 20px; font-size: 12px; }
  #login input {
    width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line);
    border-radius: var(--radius); outline: none;
  }
  #login input:focus { border-color: var(--accent); }
  #login button { width: 100%; margin-top: 12px; padding: 10px; }

  /* ---- 布局 ---- */
  #app { display: none; height: 100%; grid-template-columns: 190px 1fr; }
  #app.show { display: grid; }
  aside {
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; overflow: hidden;
  }
  aside .brand { padding: 18px 16px 14px; font-weight: 600; font-size: 14px; letter-spacing: .3px; }
  aside .brand small { display: block; color: var(--fg-mute); font-weight: 400; font-size: 11px; margin-top: 2px; }
  aside nav { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
  aside nav button {
    display: block; width: 100%; text-align: left; background: none; border: 0;
    padding: 8px 10px; border-radius: 6px; color: var(--fg-dim); cursor: pointer;
  }
  aside nav button:hover { background: var(--panel-2); color: var(--fg); }
  aside nav button.active { background: #2a3a4d; color: #cfe6ff; }
  aside nav .grp { color: var(--fg-mute); font-size: 11px; padding: 14px 10px 6px; }
  main { display: flex; flex-direction: column; overflow: hidden; }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h2 { font-size: 15px; margin: 0; flex: 1; }
  #content { flex: 1; overflow-y: auto; padding: 20px; }

  /* ---- 组件 ---- */
  button.btn {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 12px; cursor: pointer; color: var(--fg);
  }
  button.btn:hover { border-color: var(--accent); }
  button.btn.primary { background: #2f6ea8; border-color: #2f6ea8; }
  button.btn.primary:hover { background: #3a82c4; }
  button.btn.danger { color: var(--danger); }
  button.btn.danger:hover { border-color: var(--danger); background: #3a262b; }
  button.btn:disabled { opacity: .45; cursor: not-allowed; }
  button.mini { padding: 3px 8px; font-size: 12px; }

  input.field, select.field {
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; outline: none;
  }
  input.field:focus, select.field:focus { border-color: var(--accent); }
  input.field.sm { width: 70px; padding: 3px 6px; }

  .pill { padding: 2px 9px; border-radius: 99px; font-size: 11px; border: 1px solid var(--line); color: var(--fg-dim); }
  .pill.on { color: var(--ok); border-color: #2c5c4c; background: #17322b; }
  .pill.off { color: var(--danger); border-color: #5c2c33; background: #33191d; }
  .tag { padding: 1px 7px; border-radius: 4px; font-size: 11px; background: var(--panel-2); color: var(--fg-dim); }
  .tag.open { background: #17322b; color: var(--ok); }
  .tag.archived { background: #2a2d36; color: var(--fg-mute); }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px;
  }
  .card .k { color: var(--fg-dim); font-size: 11px; }
  .card .v { font-size: 22px; font-weight: 600; margin-top: 4px; letter-spacing: .5px; }
  .card .s { color: var(--fg-mute); font-size: 11px; margin-top: 2px; }

  .box { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 18px; }
  .box > h3 { margin: 0; padding: 12px 16px; font-size: 13px; border-bottom: 1px solid var(--line); color: var(--fg-dim); font-weight: 500; }
  .box > .body { padding: 14px 16px; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--fg-dim); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; }
  tbody tr:hover { background: var(--panel-2); }
  tbody tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .dim { color: var(--fg-dim); }
  .mute { color: var(--fg-mute); }
  .nowrap { white-space: nowrap; }
  .empty { padding: 28px; text-align: center; color: var(--fg-mute); }

  .kv { display: grid; grid-template-columns: 200px 1fr; gap: 6px 16px; }
  .kv dt { color: var(--fg-dim); }
  .kv dd { margin: 0; word-break: break-all; }

  .msgs { max-height: 46vh; overflow-y: auto; }
  .msg { padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .msg:last-child { border-bottom: 0; }
  .msg .who { color: var(--accent); font-size: 12px; }
  .msg .who .t { color: var(--fg-mute); margin-left: 8px; }
  .msg .txt { white-space: pre-wrap; word-break: break-word; margin-top: 2px; }
  .msg.rec { background: #1d2530; border-radius: 6px; padding: 8px 10px; }

  pre.content {
    white-space: pre-wrap; word-break: break-word; background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 12px;
    max-height: 46vh; overflow: auto; margin: 0; font-size: 12px; line-height: 1.7;
  }
  .summary {
    background: #1b2a33; border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0;
    padding: 10px 14px; white-space: pre-wrap; word-break: break-word;
  }

  /* ---- 弹层 ---- */
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; z-index: 60; }
  #modal.show { display: block; }
  #modal .sheet {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: min(860px, 92vw); max-height: 88vh; overflow: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  }
  #modal .sheet > header { border-radius: 12px 12px 0 0; position: sticky; top: 0; background: var(--panel); z-index: 2; }
  #modal .sheet .body { padding: 16px 20px 22px; }
  .row-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }

  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 16px; max-width: 70vw;
  }
  .toast.ok { border-color: #2c5c4c; color: var(--ok); }
  .toast.err { border-color: #5c2c33; color: var(--danger); }

  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .logline { font-family: ui-monospace, Consolas, monospace; font-size: 12px; padding: 3px 0; border-bottom: 1px solid #1f232c; display: flex; gap: 10px; }
  .logline .lv { width: 48px; flex: none; }
  .logline.info .lv { color: var(--accent); }
  .logline.warn .lv { color: var(--warn); }
  .logline.error .lv { color: var(--danger); }
  .logline.debug .lv { color: var(--fg-mute); }
  .logline .m { white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>

<div id="login">
  <form class="card" id="login-form">
    <h1>肥肥风筝猫 管理台</h1>
    <p>请输入 ADMIN_TOKEN 口令</p>
    <input id="login-token" type="password" placeholder="口令" autocomplete="current-password" autofocus>
    <button class="btn primary" type="submit">进入</button>
  </form>
</div>

<div id="app">
  <aside>
    <div class="brand">肥肥风筝猫<small>管理台</small></div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <header>
      <h2 id="title">概览</h2>
      <span id="conn" class="pill">连接中…</span>
      <button class="btn mini" data-act="refresh">刷新</button>
      <button class="btn mini" data-act="logout">退出</button>
    </header>
    <section id="content"><div class="empty">加载中…</div></section>
  </main>
</div>

<div id="modal"><div class="sheet"><header><h2 id="modal-title"></h2><button class="btn mini" data-act="close-modal">关闭</button></header><div class="body" id="modal-body"></div></div></div>
<div id="toast"></div>

<script>
'use strict';

/* ---------------- 基础工具 ---------------- */

const $ = (s) => document.querySelector(s);
const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
// 所有来自数据库的内容（昵称、消息、文件名、总结、日志）都必须过这里
const esc = (s) => String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, (c) => ESC_MAP[c]);

const pad = (n) => String(n).padStart(2, '0');
function fmtTime(ms) {
  if (!ms) return '—';
  const d = new Date(ms);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' +
    pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}
function fmtAgo(ms) {
  if (!ms) return '—';
  const s = Math.floor((Date.now() - ms) / 1000);
  if (s < 60) return s + ' 秒前';
  if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
  if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
  return Math.floor(s / 86400) + ' 天前';
}
function fmtBytes(n) {
  if (!n) return '0 B';
  const u = ['B', 'KB', 'MB', 'GB'];
  let i = 0;
  let v = n;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return (i === 0 ? v : v.toFixed(1)) + ' ' + u[i];
}
function fmtDur(ms) {
  const s = Math.floor(ms / 1000);
  const d = Math.floor(s / 86400);
  const h = Math.floor((s % 86400) / 3600);
  const m = Math.floor((s % 3600) / 60);
  if (d) return d + ' 天 ' + h + ' 小时';
  if (h) return h + ' 小时 ' + m + ' 分';
  return m + ' 分 ' + (s % 60) + ' 秒';
}

function monitorCell(m) {
  if (!m) return '<span class="mute">未启用</span>';
  if (!m.enabled) return '<span class="pill">已关闭（MONITOR=0）</span>';
  const parts = [];
  if (m.healthy === null || m.healthy === undefined) parts.push('<span class="pill">等待首次探活</span>');
  else if (m.healthy) parts.push('<span class="pill on">正常</span>');
  else parts.push('<span class="pill off">异常</span>');
  if (m.lastCheckAt) parts.push('<span class="dim">' + esc(fmtAgo(m.lastCheckAt)) + '探活</span>');
  if (!m.webhookConfigured) parts.push('<span class="pill off">未配置告警出口</span>');
  if (m.alertsSent) parts.push('<span class="dim">已告警 ' + esc(m.alertsSent) + ' 次</span>');
  if (m.lastReason) parts.push('<span class="dim">· ' + esc(m.lastReason) + '</span>');
  return parts.join(' ');
}

function toast(msg, kind) {
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.textContent = msg;
  $('#toast').appendChild(el);
  setTimeout(() => el.remove(), 3600);
}

async function api(path, opts) {
  const res = await fetch('/api' + path, Object.assign({
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
  }, opts || {}));
  if (res.status === 401) { showLogin(); throw new Error('未登录'); }
  const ct = res.headers.get('content-type') || '';
  if (!ct.includes('application/json')) throw new Error('HTTP ' + res.status + '：' + (await res.text()).slice(0, 200));
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
  return data;
}

/* ---------------- 通用片段 ---------------- */

function table(cols, rows) {
  if (!rows.length) return '<div class="empty">暂无数据</div>';
  return '<table><thead><tr>' +
    cols.map((c) => '<th' + (c.num ? ' class="num"' : '') + '>' + esc(c.t) + '</th>').join('') +
    '</tr></thead><tbody>' +
    rows.map((r) => '<tr>' + r.map((cell, i) => '<td' + (cols[i] && cols[i].num ? ' class="num"' : '') + '>' + cell + '</td>').join('') + '</tr>').join('') +
    '</tbody></table>';
}

function box(title, inner, extra) {
  return '<div class="box"><h3>' + esc(title) + (extra || '') + '</h3>' + inner + '</div>';
}

function userCell(row) {
  return esc(row.display_name || '（无昵称）') + ' <span class="mute mono">' + esc(row.qq_id) + '</span>';
}

function openModal(title, html) {
  $('#modal-title').textContent = title;
  $('#modal-body').innerHTML = html;
  $('#modal').classList.add('show');
}
function closeModal() {
  $('#modal').classList.remove('show');
  $('#modal-body').innerHTML = '';
}

function confirmDialog(title, message, confirmLabel) {
  return new Promise((resolve) => {
    openModal(title,
      '<p>' + esc(message) + '</p>' +
      '<div class="row-actions"><button class="btn danger" id="cf-yes">' + esc(confirmLabel || '确认') + '</button>' +
      '<button class="btn" id="cf-no">取消</button></div>');
    $('#cf-yes').onclick = () => { closeModal(); resolve(true); };
    $('#cf-no').onclick = () => { closeModal(); resolve(false); };
  });
}

/* ---------------- 视图 ---------------- */

const VIEWS = {
  overview: { label: '概览', group: '运行', render: viewOverview },
  sessions: { label: '记录会话', group: '数据', render: viewSessions },
  snippets: { label: '口嗨片段', group: '数据', render: viewSnippets },
  files: { label: '上传资料', group: '数据', render: viewFiles },
  users: { label: '用户', group: '数据', render: viewUsers },
  search: { label: '全局检索', group: '数据', render: viewSearch },
  boomerangs: { label: '回旋镖', group: '运营', render: viewBoomerangs },
  export: { label: '导出', group: '运营', render: viewExport },
  config: { label: '配置', group: '系统', render: viewConfig },
  logs: { label: '日志', group: '系统', render: viewLogs },
};

let current = 'overview';
let timers = [];

function clearTimers() {
  timers.forEach(clearInterval);
  timers = [];
}

async function go(name) {
  current = name;
  clearTimers();
  closeModal();
  document.querySelectorAll('#nav button').forEach((b) => b.classList.toggle('active', b.dataset.view === name));
  $('#title').textContent = VIEWS[name].label;
  const content = $('#content');
  content.innerHTML = '<div class="empty">加载中…</div>';
  try {
    await VIEWS[name].render(content);
  } catch (e) {
    content.innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>';
  }
}

function buildNav() {
  const nav = $('#nav');
  let html = '';
  let lastGroup = '';
  for (const [key, v] of Object.entries(VIEWS)) {
    if (v.group !== lastGroup) {
      html += '<div class="grp">' + esc(v.group) + '</div>';
      lastGroup = v.group;
    }
    html += '<button data-view="' + key + '">' + esc(v.label) + '</button>';
  }
  nav.innerHTML = html;
  nav.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-view]');
    if (b) go(b.dataset.view);
  });
}

/* ---- 概览 ---- */

async function viewOverview(el) {
  const d = await api('/overview');
  const p = d.process;
  const data = d.data;
  const bot = d.bot;

  setConn(bot);

  const cards = [
    ['用户', data.users, ''],
    ['记录会话', data.sessions, data.openSessions ? data.openSessions + ' 个进行中' : '无进行中'],
    ['捕获消息', data.messages, data.lastMessageAt ? '最近 ' + fmtAgo(data.lastMessageAt) : ''],
    ['口嗨片段', data.snippets, data.summarized + ' 篇有总结'],
    ['上传资料', data.files, data.lastUploadAt ? '最近 ' + fmtAgo(data.lastUploadAt) : ''],
    ['检索索引', data.indexRows, ''],
    ['数据库', fmtBytes(d.disk.db), '导出 ' + fmtBytes(d.disk.exports.bytes) + ' / 上传 ' + fmtBytes(d.disk.uploads.bytes)],
    ['已运行', fmtDur(p.uptimeMs), '内存 ' + fmtBytes(p.rss)],
  ];

  el.innerHTML =
    '<div class="cards">' + cards.map((c) =>
      '<div class="card"><div class="k">' + esc(c[0]) + '</div><div class="v">' + esc(c[1]) + '</div>' +
      '<div class="s">' + esc(c[2] || ' ') + '</div></div>').join('') + '</div>' +

    box('运行状态',
      '<div class="body"><dl class="kv">' +
      '<dt>OneBot 连接</dt><dd>' + (bot.connected ? '<span class="pill on">已连接</span>' : '<span class="pill off">未连接</span>') +
        ' <span class="mono dim">' + esc(bot.url || bot.mode || '') + '</span></dd>' +
      '<dt>本次连接时长</dt><dd>' + (bot.connected && bot.connectedMs ? esc(fmtDur(bot.connectedMs)) : '—') + '</dd>' +
      '<dt>最后收到事件</dt><dd>' + (bot.lastEventAt ? esc(fmtAgo(bot.lastEventAt)) + ' <span class="mono dim">' + esc(fmtTime(bot.lastEventAt)) + '</span>' : '<span class="mute">尚未收到</span>') + '</dd>' +
      '<dt>累计重连</dt><dd>' + esc(bot.reconnects === undefined ? '—' : bot.reconnects) +
        (bot.retry ? ' <span class="dim">（正在第 ' + esc(bot.retry) + ' 次退避等待）</span>' : '') + '</dd>' +
      '<dt>未完成动作</dt><dd>' + esc(bot.pendingCalls === undefined ? '—' : bot.pendingCalls) + '</dd>' +
      '<dt>健康检查</dt><dd class="mono">GET /healthz <span class="dim">（免登录，供外部探活）</span></dd>' +
      '<dt>掉线监控</dt><dd>' + monitorCell(d.monitor) + '</dd>' +
      '<dt>大模型总结</dt><dd>' + (d.flags.llm ? '<span class="pill on">已配置</span>' : '<span class="pill off">未配置</span>') + '</dd>' +
      '<dt>PDF 中文字体</dt><dd>' + (d.flags.font ? esc(d.flags.font) : '<span class="pill off">未探测到（导出回退 txt）</span>') + '</dd>' +
      '<dt>运行模式</dt><dd>' + (d.flags.adminOnly ? '仅管理台（未连 OneBot）' : '机器人在线') + '</dd>' +
      '<dt>进程运行时长</dt><dd>' + esc(fmtDur(p.uptimeMs)) + ' <span class="mono dim">（启动于 ' + esc(fmtTime(p.startedAt)) + '）</span></dd>' +
      '<dt>Node / 平台</dt><dd class="mono">' + esc(p.node) + ' · ' + esc(p.platform) + ' · PID ' + esc(p.pid) + '</dd>' +
      '<dt>数据目录</dt><dd class="mono">' + esc(d.disk.dataDir) + '</dd>' +
      '</dl></div>') +

    box('最近口嗨', table(
      [{ t: 'ID', num: true }, { t: '归属' }, { t: '摘要' }, { t: '时间' }, { t: '' }],
      data.recentSnippets.map((s) => [
        esc(s.id), userCell(s),
        s.summary_head ? '<span class="dim">' + esc(s.summary_head) + (s.summary_head.length >= 80 ? '…' : '') + '</span>' : '<span class="mute">（无总结）</span>',
        '<span class="nowrap">' + esc(fmtTime(s.created_at)) + '</span>',
        '<button class="btn mini" data-act="snippet" data-id="' + esc(s.id) + '">查看</button>',
      ])
    )) +

    box('最近资料', table(
      [{ t: 'ID', num: true }, { t: '归属' }, { t: '文件名' }, { t: '时间' }, { t: '' }],
      data.recentFiles.map((f) => [
        esc(f.id), userCell(f), esc(f.filename), '<span class="nowrap">' + esc(fmtTime(f.uploaded_at)) + '</span>',
        '<button class="btn mini" data-act="file" data-id="' + esc(f.id) + '">查看</button>',
      ])
    )) +

    box('活跃群', table(
      [{ t: '群号' }, { t: '会话数', num: true }, { t: '最近活动' }],
      (data.groups || []).map((g) => [
        '<span class="mono">' + esc(g.group_id) + '</span>', esc(g.session_count), esc(fmtTime(g.last_active)),
      ])
    ));
}

function setConn(bot) {
  const el = $('#conn');
  if (bot.connected) {
    el.className = 'pill on';
    el.textContent = 'OneBot 已连接';
  } else if (bot.mode === 'admin-only') {
    el.className = 'pill';
    el.textContent = '仅管理台';
  } else {
    el.className = 'pill off';
    el.textContent = 'OneBot 未连接';
  }
}

async function archiveSession(id, summarize) {
  const ok = await confirmDialog('结束会话', summarize
    ? '将立即归档会话，并调用大模型生成总结。确认？'
    : '将立即归档会话，不调用大模型。确认？', '结束');
  if (!ok) return;
  const r = await api('/sessions/' + id + '/archive', { method: 'POST', body: JSON.stringify({ summarize }) });
  toast('会话已结束，生成片段 #' + r.snippetId + '（' + r.messageCount + ' 条）', 'ok');
  closeModal();
  go(current);
}

async function doExport() {
  const qq = $('#ex-user').value;
  const format = $('#ex-fmt').value;
  const scope = $('#ex-scope').value;
  const res = await fetch('/api/export', {
    method: 'POST',
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ qq, format, scope }),
  });
  if (res.status === 401) { showLogin(); return; }
  if (!res.ok) {
    const d = await res.json().catch(() => ({}));
    throw new Error(d.error || 'HTTP ' + res.status);
  }
  const cd = res.headers.get('Content-Disposition') || '';
  let name = 'export.zip';
  const m = /filename\*=UTF-8''([^;]+)/i.exec(cd);
  if (m) { try { name = decodeURIComponent(m[1]); } catch (e) { /* ignore */ } }
  const blob = await res.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  const note = res.headers.get('X-Export-Note');
  toast('已导出 ' + res.headers.get('X-Export-Count') + ' 篇：' + name + (note ? '（' + decodeURIComponent(note) + '）' : ''), 'ok');
}

/* ---------------- 全局事件 ---------------- */

document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;
  try {
    switch (act) {
      case 'refresh': return go(current);
      case 'logout':
        await api('/logout', { method: 'POST' });
        return showLogin();
      case 'close-modal': return closeModal();
      case 'session-filter': sessionFilter = el.dataset.v; return go('sessions');
      case 'session': return await showSession(id);
      case 'archive': return await archiveSession(id, true);
      case 'archive-nosum': return await archiveSession(id, false);
      case 'snippet': return await showSnippet(id);
      case 'file': return await showFile(id);
      case 'del-snippet': {
        const ok = await confirmDialog('删除片段', '将永久删除片段 #' + id + ' 及其检索索引（原始消息保留在会话里）。不可撤销。', '永久删除');
        if (!ok) return;
        await api('/snippets/' + id, { method: 'DELETE' });
        toast('已删除片段 #' + id, 'ok');
        closeModal();
        return go(current);
      }
      case 'del-file': {
        const ok = await confirmDialog('删除资料', '将永久删除资料 #' + id + '、检索索引与磁盘文件。不可撤销。', '永久删除');
        if (!ok) return;
        await api('/files/' + id, { method: 'DELETE' });
        toast('已删除资料 #' + id, 'ok');
        closeModal();
        return go(current);
      }
      case 'resummarize': {
        el.disabled = true;
        el.textContent = '生成中…';
        try {
          const r = await api('/snippets/' + id + '/resummarize', { method: 'POST' });
          toast('总结已更新', 'ok');
          return await showSnippet(id);
        } finally {
          el.disabled = false;
          el.textContent = '重新生成总结';
        }
      }
      case 'boom': {
        await api('/snippets/' + id + '/boomerang', { method: 'POST' });
        toast('回旋镖已私聊发送', 'ok');
        return;
      }
      case 'save-user': return await saveUser(el.dataset.qq);
      case 'del-user': return await deleteUser(el.dataset.qq);
      case 'do-search': return await doSearch();
      case 'boom-run': {
        const r = await api('/boomerangs/run', { method: 'POST' });
        toast('本轮已发送 ' + r.sent + ' 条回旋镖', 'ok');
        return go('boomerangs');
      }
      case 'do-export': return await doExport();
      case 'reconnect': {
        await api('/onebot/reconnect', { method: 'POST' });
        toast('已触发重连', 'ok');
        return;
      }
      case 'monitor-check': {
        const r = await api('/monitor/check', { method: 'POST' });
        const s = r.status || {};
        toast(s.healthy ? '探活正常：' + (s.lastReason || '') : '探活异常：' + (s.lastReason || ''), s.healthy ? 'ok' : 'err');
        return;
      }
      case 'log-level': logLevel = el.dataset.v; return go('logs');
      case 'log-clear': toast('日志只保留在内存中，重启即清空', 'ok'); return;
    }
  } catch (err) {
    toast(err.message, 'err');
  }
});

$('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

/* ---------------- 登录 / 启动 ---------------- */

function showLogin() {
  clearTimers();
  $('#app').classList.remove('show');
  $('#login').classList.add('show');
  $('#login-token').value = '';
  setTimeout(() => $('#login-token').focus(), 50);
}

$('#login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  try {
    await api('/login', { method: 'POST', body: JSON.stringify({ token: $('#login-token').value }) });
    await boot();
  } catch (err) {
    toast(err.message, 'err');
  } finally {
    btn.disabled = false;
  }
});

async function boot() {
  $('#login').classList.remove('show');
  $('#app').classList.add('show');
  if (!$('#nav').childElementCount) buildNav();
  await go(current);
  // 顶部连接状态轻量轮询
  timers.push(setInterval(async () => {
    try { setConn((await api('/overview')).bot); } catch (e) { /* ignore */ }
  }, 15000));
}

(async function init() {
  try {
    const s = await api('/session');
    if (s.authed) await boot();
    else showLogin();
  } catch (e) {
    showLogin();
  }
})();
</script>
